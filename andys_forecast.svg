<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 490" width="100%" height="100%">
  <defs>
    <!-- Heat Dome Radial Backlight Aura (Warm Radiant Orange) -->
    <radialGradient id="heatDomeAura" cx="45%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff3d00" stop-opacity="0.55"/>
      <stop offset="45%" stop-color="#ff7a00" stop-opacity="0.32"/>
      <stop offset="75%" stop-color="#ff9100" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#ff9100" stop-opacity="0"/>
    </radialGradient>

    <!-- Heat Dome Blur Filter -->
    <filter id="heatAuraGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="28" result="blur"/>
    </filter>

    <!-- Raindrop Glow -->
    <filter id="raindropGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1" result="blur"/>
    </filter>
  </defs>

  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    .sans { font-family: "Product Sans", "Google Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }

    /* Synoptic Subtle Living Animations */
    @keyframes rainDrizzle {
      0% { transform: translateY(-2px); opacity: 0.7; }
      50% { opacity: 1; }
      100% { transform: translateY(5px); opacity: 0.5; }
    }
    @keyframes heatPulse {
      0%, 100% { transform: scale(1); opacity: 0.85; }
      50% { transform: scale(1.08); opacity: 1; }
    }

    .rain-streak {
      animation: rainDrizzle 1.8s ease-in-out infinite;
    }
    .heat-glow {
      animation: heatPulse 5s ease-in-out infinite;
      transform-origin: 410px 165px;
    }
  </style>

  <!-- ================= SHELL BACKGROUND CARD (SLATE CHARCOAL THEME) ================= -->
  <rect width="940" height="490" rx="18" fill="#1e2229" stroke="#282e39" stroke-width="1.2"/>

  <!-- ================= TOP HEADER ================= -->
  <g class="mono" font-size="11.5" letter-spacing="0.4">
    <text x="38" y="36" fill="#8c99ab" font-weight="600">
      GOOGLE SYNOPTIC MARK // STUDY-TO-HIRE PROPOSAL
    </text>
    <text x="38" y="52" fill="#00e5ff" font-weight="700">
      [PT:AC]
    </text>
    <text x="902" y="36" text-anchor="end" fill="#8c99ab" font-weight="500" class="sans">
      Grow with Google &#8226; Merit America &#8226; <tspan fill="#d1d5db" font-weight="600">Andy Kieckhefer</tspan>
    </text>
  </g>

  <!-- ================= HEAT DOME AMBIENT SUNBURST BACKLIGHT ================= -->
  <g class="heat-glow">
    <ellipse cx="410" cy="165" rx="165" ry="80" fill="url(#heatDomeAura)" filter="url(#heatAuraGlow)"/>
  </g>

  <!-- ================= GOOGLE WORDMARK ================= -->
  <!-- 
    G (Orange) = Pacific Ridge / Heat Dome Western Boundary
    o (Orange) = Great Plains Ridge
    o (Amber)  = Central Heat Dome Epicenter
    g (Gold)   = Convective Boundary
    l (Green)  = Fair Weather / Stable Appalachian Air Mass
    e (Cyan)   = New England Atlantic Rain / Showers with Raindrop
  -->
  <g class="sans" font-size="118" font-weight="900" letter-spacing="-2">
    <!-- 'G' - Heat Dome Western Flank -->
    <text x="270" y="195" fill="#ff5722">G</text>

    <!-- 'o' - Heat Dome Crest -->
    <text x="360" y="195" fill="#ff7a00">o</text>

    <!-- 'o' - 594dm Central Heat Dome -->
    <text x="436" y="195" fill="#ff9100">o</text>

    <!-- 'g' - Convective Flank -->
    <text x="512" y="195" fill="#ffa726">g</text>

    <!-- 'l' - Fair Weather (Green) -->
    <text x="582" y="195" fill="#00e676">l</text>

    <!-- 'e' - New England Rain (Cyan / Aqua) -->
    <text x="616" y="195" fill="#00e5ff">e</text>
  </g>

  <!-- ================= NEW ENGLAND RAINDROP OVER 'e' ================= -->
  <g filter="url(#raindropGlow)">
    <rect x="646" y="96" width="4.5" height="17" rx="2.25" fill="#00e5ff" class="rain-streak"/>
  </g>

  <!-- ================= CONUS SYNOPTIC WEATHER PILL ================= -->
  <g class="sans">
    <rect x="150" y="238" width="640" height="38" rx="19" fill="#111c27" stroke="#00acc1" stroke-width="1.3"/>
    <text x="470" y="262" text-anchor="middle" font-size="13" font-weight="700">
      <tspan fill="#ff9100">☀️ </tspan>
      <tspan fill="#00e5ff">CONUS SYNOPTIC: RIDGE / HEAT DOME (CENTRAL) • 🌧️ SHOWERS (EASTERN)</tspan>
    </text>
  </g>

  <!-- ================= SEARCH BAR ================= -->
  <g class="sans">
    <rect x="80" y="300" width="780" height="52" rx="26" fill="#262b35" stroke="#333a48" stroke-width="1.2"/>
    <!-- Magnifying Glass Icon -->
    <g transform="translate(106, 316)" stroke="#8c99ab" stroke-width="2.2" fill="none">
      <circle cx="8" cy="8" r="7"/>
      <line x1="13.5" y1="13.5" x2="19" y2="19"/>
    </g>
    <text x="140" y="333" font-size="16" fill="#f1f5f9" font-weight="500">
      NWS severe weather radar Atlanta
    </text>
  </g>

  <!-- ================= UX SIMULATION CONTROLS ================= -->
  <g class="sans">
    <text x="105" y="398" class="mono" font-size="10.5" font-weight="700" fill="#8c99ab">
      <tspan x="105" dy="0">UX</tspan>
      <tspan x="105" dy="14">SIMULATION:</tspan>
    </text>

    <!-- 1. National Synoptic (Default) - Active Blue -->
    <rect x="205" y="382" width="200" height="46" rx="8" fill="#1d4ed8" stroke="#3b82f6" stroke-width="1.2"/>
    <text x="305" y="410" fill="#ffffff" font-size="13" font-weight="700" text-anchor="middle">
      1. National Synoptic (Default)
    </text>

    <!-- 2. Hyperlocal GPS (Atlanta 91.4°F) -->
    <rect x="420" y="382" width="220" height="46" rx="8" fill="#1b1f28" stroke="#2c3340" stroke-width="1.2"/>
    <text x="530" y="410" fill="#cbd5e1" font-size="13" font-weight="700" text-anchor="middle">
      2. Hyperlocal GPS (Atlanta 91.4°F)
    </text>

    <!-- 3. Classic Standard Logo -->
    <rect x="655" y="382" width="180" height="46" rx="8" fill="#1b1f28" stroke="#2c3340" stroke-width="1.2"/>
    <text x="745" y="410" fill="#cbd5e1" font-size="13" font-weight="700" text-anchor="middle">
      3. Classic Standard Logo
    </text>
  </g>

  <!-- ================= FOOTER ================= -->
  <g class="mono" font-size="10.5" fill="#737e90" text-anchor="middle">
    <text x="470" y="462">
      15 U.S.C. &#167; 3724 Citizen Science &#8226; NOAA Open Data Integration &#8226; WCAG 2.1 AAA Compliant
    </text>
  </g>
</svg>
